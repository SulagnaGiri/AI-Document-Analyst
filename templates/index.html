<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Analyst</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Document Analyst</h1>
        <p>Classify and extract structured fields from business documents.</p>
      </header>

      <main class="grid">
        <section class="panel">
          <h2>Single Document</h2>
          <label for="doc-name">Document name</label>
          <input id="doc-name" type="text" value="document.txt" />

          <label for="doc-text">Document text</label>
          <textarea id="doc-text" rows="12" placeholder="Paste or type the document content here...">Email
From: procurement@northstar.com
To: accounts@company.com
Subject: Vendor renewal confirmation

Dear team,
Please review the updated policy and supporting documents before approval.</textarea>

          <button id="analyze-btn">Analyze document</button>
          <div id="analysis-result" class="result-box empty">Results will appear here.</div>
        </section>

        <section class="panel">
          <h2>Compare two documents</h2>
          <label for="invoice-text">Document A text</label>
          <textarea id="invoice-text" rows="8" placeholder="Paste the first document here...">Email
From: procurement@northstar.com
To: accounts@company.com
Subject: Renewal confirmation</textarea>

          <label for="po-text">Document B text</label>
          <textarea id="po-text" rows="8" placeholder="Paste the second document here...">Policy Document
Effective date: 2026-01-01
Reviewer: Compliance Team
Summary: Approval is required before any renewal is processed.</textarea>

          <button id="compare-btn">Compare documents</button>
          <div id="compare-result" class="result-box empty">Comparison results will appear here.</div>
        </section>

        <section class="panel full-width">
          <h2>Ask a Question</h2>
          <label for="question-input">Question</label>
          <input id="question-input" type="text" value="What is the total amount?" />

          <label for="question-docs">Document text for question context</label>
          <textarea id="question-docs" rows="10" placeholder="Paste one or more documents to answer from...">Delivery Note
Supplier: Northstar Logistics
PO Number: PO-778
Date: 2026-04-10
Status: Goods delivered</textarea>

          <button id="answer-btn">Answer question</button>
          <div id="question-result" class="result-box empty">Answer will appear here.</div>
        </section>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
